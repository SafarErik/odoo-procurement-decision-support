name: procurement-planning-test

services:
  decision-db:
    image: postgres:16.15-bookworm
    environment:
      POSTGRES_DB: ${TEST_POSTGRES_DB:-planning_test}
      POSTGRES_USER: ${TEST_POSTGRES_USER:-planning_test}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped
