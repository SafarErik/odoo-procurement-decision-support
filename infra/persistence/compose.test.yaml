name: procurement-decision-support-t11-test

services:
  decision-db:
    image: postgres:16.15-bookworm
    environment:
      POSTGRES_DB: ${T11_POSTGRES_DB:-decision_cases_test}
      POSTGRES_USER: ${T11_POSTGRES_USER:-t11_test}
      POSTGRES_PASSWORD: ${T11_POSTGRES_PASSWORD:?Set T11_POSTGRES_PASSWORD for the test database}
    ports:
      - "127.0.0.1:${T11_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

