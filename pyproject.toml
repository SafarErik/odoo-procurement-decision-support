[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo-procurement-decision-support"
version = "0.0.1"
description = "Development foundation for an ERP-independent procurement decision-support system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "pulp==3.3.0",
    "reportlab==4.4.10",
    "scikit-learn==1.8.0",
    "numpy==2.3.5",
    "scipy==1.16.3",
    "joblib==1.5.2",
    "threadpoolctl==3.6.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
frontend = [
    "reflex==0.9.12",
    "sqlalchemy[asyncio]>=2.0,<3.0",
]
dev = [
    "podman-compose>=1.6,<2.0",
    "pytest>=8.3,<9.0",
    "pypdf>=6,<7",
    "ruff>=0.8,<1.0",
]
e2e = [
    "pytest-playwright>=0.7,<1.0",
]

[tool.setuptools.packages.find]
include = [
    "application*",
    "backend*",
    "frontend*",
    "decision_core*",
    "odoo_adapter*",
    "persistence*",
    "optimization_adapter*",
    "document_adapter*",
    "supplier_evaluation*",
]

[tool.setuptools.package-data]
document_adapter = ["fonts/*.ttf", "fonts/LICENSE.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = [
    "integration: tests requiring running application or infrastructure components",
    "e2e: browser-level tests covering the complete user-facing flow",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = [
    "application",
    "backend",
    "decision_core",
    "frontend",
    "odoo_adapter",
    "persistence",
    "optimization_adapter",
    "supplier_evaluation",
]
