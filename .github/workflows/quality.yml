name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development dependencies
        run: python -m pip install -e ".[frontend,dev]"

      # The same gate as locally: ruff format/lint, compileall, fast tests (real CBC and
      # scikit-learn; missing runtimes fail) and pip check. See tools/dev.py.
      - name: Fast quality gate
        run: python -m tools.dev check

      - name: Check whitespace errors
        run: git diff --check

      - name: Validate Compose configuration
        shell: bash
        run: |
          env_file="$RUNNER_TEMP/odoo-quality.env"
          postgres_password="$(openssl rand -hex 24)"
          odoo_master_password="$(openssl rand -hex 24)"
          printf '%s\n' \
            'POSTGRES_USER=odoo_ci' \
            "POSTGRES_PASSWORD=$postgres_password" \
            'POSTGRES_DB=postgres' \
            "ODOO_MASTER_PASSWORD=$odoo_master_password" \
            'ODOO_HTTP_PORT=8069' \
            > "$env_file"
          docker compose \
            --env-file "$env_file" \
            -f infra/odoo/compose.yaml \
            config --quiet
          printf '%s\n' \
            'TEST_POSTGRES_PASSWORD=synthetic-quality-only' \
            > "$RUNNER_TEMP/persistence-quality.env"
          docker compose \
            --env-file "$RUNNER_TEMP/persistence-quality.env" \
            -f infra/persistence/compose.test.yaml \
            config --quiet
