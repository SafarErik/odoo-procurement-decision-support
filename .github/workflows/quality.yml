name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development dependencies
        run: python -m pip install -e ".[frontend,dev]"

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Compile Python sources
        run: python -m compileall application backend frontend decision_core odoo_adapter optimization_adapter persistence migrations

      - name: Run fast tests
        run: pytest -m "not integration and not e2e" -v

      - name: Verify required T13 Python and CBC runtime
        run: python -m pytest tests/test_t13_solver_runtime.py -v

      - name: Check installed dependencies
        run: python -m pip check

      - name: Check whitespace errors
        run: git diff --check

      - name: Validate Compose configuration
        shell: bash
        run: |
          env_file="$RUNNER_TEMP/odoo-quality.env"
          postgres_password="$(openssl rand -hex 24)"
          odoo_master_password="$(openssl rand -hex 24)"
          printf '%s\n' \
            'POSTGRES_USER=odoo_ci' \
            "POSTGRES_PASSWORD=$postgres_password" \
            'POSTGRES_DB=postgres' \
            "ODOO_MASTER_PASSWORD=$odoo_master_password" \
            'ODOO_HTTP_PORT=8069' \
            > "$env_file"
          docker compose \
            --env-file "$env_file" \
            -f infra/odoo/compose.yaml \
            config --quiet
          printf '%s\n' \
            'T11_POSTGRES_PASSWORD=synthetic-quality-only' \
            > "$RUNNER_TEMP/t11-quality.env"
          docker compose \
            --env-file "$RUNNER_TEMP/t11-quality.env" \
            -f infra/persistence/compose.test.yaml \
            config --quiet
