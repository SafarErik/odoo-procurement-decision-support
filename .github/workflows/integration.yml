name: Container and API integration

on:
  pull_request:
    paths:
      - ".github/workflows/integration.yml"
      - ".env.example"
      - "application/**"
      - "backend/**"
      - "decision_core/**/*.py"
      - "frontend/**"
      - "infra/persistence/**"
      - "infra/odoo/**"
      - "migrations/**"
      - "odoo_adapter/**/*.py"
      - "persistence/**"
      - "supplier_evaluation/**"
      - "tests/**"
      - "pyproject.toml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/integration.yml"
      - ".env.example"
      - "application/**"
      - "backend/**"
      - "decision_core/**/*.py"
      - "frontend/**"
      - "infra/persistence/**"
      - "infra/odoo/**"
      - "migrations/**"
      - "odoo_adapter/**/*.py"
      - "persistence/**"
      - "supplier_evaluation/**"
      - "tests/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: container-api-integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BACKEND_BASE_URL: http://127.0.0.1:8000
      ODOO_BASE_URL: http://127.0.0.1:8069

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node.js for frontend compilation
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"

      - name: Install project and development dependencies
        run: python -m pip install -e ".[frontend,dev]"

      - name: Create temporary Compose environment
        shell: bash
        run: |
          env_file="$RUNNER_TEMP/odoo-integration.env"
          postgres_password="$(openssl rand -hex 24)"
          odoo_master_password="$(openssl rand -hex 24)"
          printf '%s\n' \
            'POSTGRES_USER=odoo_ci' \
            "POSTGRES_PASSWORD=$postgres_password" \
            'POSTGRES_DB=postgres' \
            "ODOO_MASTER_PASSWORD=$odoo_master_password" \
            'ODOO_HTTP_PORT=8069' \
            'T11_POSTGRES_DB=decision_cases_test' \
            'T11_POSTGRES_USER=t11_test' \
            "T11_POSTGRES_PASSWORD=$postgres_password" \
            'T11_POSTGRES_PORT=55432' \
            > "$env_file"
          echo "ODOO_ENV_FILE=$env_file" >> "$GITHUB_ENV"
          echo "T11_TEST_DATABASE_URL=postgresql+psycopg://t11_test:$postgres_password@127.0.0.1:55432/decision_cases_test" >> "$GITHUB_ENV"

      - name: Start Odoo and PostgreSQL
        shell: bash
        run: |
          docker compose \
            --env-file "$ODOO_ENV_FILE" \
            -f infra/odoo/compose.yaml \
            up -d
          docker compose \
            --env-file "$ODOO_ENV_FILE" \
            -f infra/persistence/compose.test.yaml \
            up -d

          db_container="$(docker compose \
            --env-file "$ODOO_ENV_FILE" \
            -f infra/odoo/compose.yaml \
            ps -q db)"
          for attempt in {1..30}; do
            if [[ "$(docker inspect --format '{{.State.Health.Status}}' "$db_container")" == "healthy" ]]; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              echo "PostgreSQL did not become healthy in time."
              exit 1
            fi
            sleep 5
          done

          decision_db_container="$(docker compose \
            --env-file "$ODOO_ENV_FILE" \
            -f infra/persistence/compose.test.yaml \
            ps -q decision-db)"
          for attempt in {1..30}; do
            if [[ "$(docker inspect --format '{{.State.Health.Status}}' "$decision_db_container")" == "healthy" ]]; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              echo "T11 test PostgreSQL did not become healthy in time."
              exit 1
            fi
            sleep 2
          done

          for attempt in {1..60}; do
            if curl --fail --silent --output /dev/null \
              "$ODOO_BASE_URL/web/database/selector"; then
              break
            fi
            if [[ "$attempt" == "60" ]]; then
              echo "Odoo did not become reachable in time."
              exit 1
            fi
            sleep 5
          done

      - name: Start FastAPI
        shell: bash
        run: |
          uvicorn backend.app.main:app \
            > "$RUNNER_TEMP/uvicorn.log" 2>&1 &
          echo "UVICORN_PID=$!" >> "$GITHUB_ENV"

          for attempt in {1..30}; do
            if curl --fail --silent --output /dev/null \
              "$BACKEND_BASE_URL/api/v1/health"; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              echo "FastAPI did not become reachable in time."
              exit 1
            fi
            sleep 2
          done

      - name: Run integration tests only
        run: pytest -m "integration and not e2e" -v

      - name: Verify frontend compilation
        working-directory: frontend
        run: reflex export --frontend-only --no-zip

      - name: Verify technical named-volume persistence
        shell: bash
        run: |
          marker="ci-volume-marker-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          docker compose \
            --env-file "$ODOO_ENV_FILE" \
            -f infra/odoo/compose.yaml \
            exec -T db sh -ceu 'touch "$PGDATA/$1"' -- "$marker"
          docker compose \
            --env-file "$ODOO_ENV_FILE" \
            -f infra/odoo/compose.yaml \
            exec -T odoo sh -ceu 'touch "/var/lib/odoo/$1"' -- "$marker"

          docker compose \
            --env-file "$ODOO_ENV_FILE" \
            -f infra/odoo/compose.yaml \
            down
          docker compose \
            --env-file "$ODOO_ENV_FILE" \
            -f infra/odoo/compose.yaml \
            up -d

          db_container="$(docker compose \
            --env-file "$ODOO_ENV_FILE" \
            -f infra/odoo/compose.yaml \
            ps -q db)"
          for attempt in {1..30}; do
            if [[ "$(docker inspect --format '{{.State.Health.Status}}' "$db_container")" == "healthy" ]]; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              echo "PostgreSQL did not become healthy after stack recreation."
              exit 1
            fi
            sleep 5
          done

          for attempt in {1..60}; do
            if curl --fail --silent --output /dev/null \
              "$ODOO_BASE_URL/web/database/selector"; then
              break
            fi
            if [[ "$attempt" == "60" ]]; then
              echo "Odoo did not become reachable after stack recreation."
              exit 1
            fi
            sleep 5
          done

          docker compose \
            --env-file "$ODOO_ENV_FILE" \
            -f infra/odoo/compose.yaml \
            exec -T db sh -ceu 'test -f "$PGDATA/$1"' -- "$marker"
          docker compose \
            --env-file "$ODOO_ENV_FILE" \
            -f infra/odoo/compose.yaml \
            exec -T odoo sh -ceu 'test -f "/var/lib/odoo/$1"' -- "$marker"

      - name: Collect failure logs
        if: failure()
        shell: bash
        run: |
          log_dir="$RUNNER_TEMP/integration-logs"
          mkdir -p "$log_dir"
          docker compose \
            --env-file "$ODOO_ENV_FILE" \
            -f infra/odoo/compose.yaml \
            ps > "$log_dir/compose-ps.txt" 2>&1 || true
          docker compose \
            --env-file "$ODOO_ENV_FILE" \
            -f infra/odoo/compose.yaml \
            logs --no-color > "$log_dir/compose.log" 2>&1 || true
          docker compose \
            --env-file "$ODOO_ENV_FILE" \
            -f infra/persistence/compose.test.yaml \
            logs --no-color > "$log_dir/t11-persistence-compose.log" 2>&1 || true
          if [[ -f "$RUNNER_TEMP/uvicorn.log" ]]; then
            cp "$RUNNER_TEMP/uvicorn.log" "$log_dir/uvicorn.log"
          fi

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-failure-logs
          path: ${{ runner.temp }}/integration-logs
          retention-days: 3

      - name: Clean up runtime
        if: always()
        shell: bash
        run: |
          if [[ -n "${UVICORN_PID:-}" ]]; then
            kill "$UVICORN_PID" 2>/dev/null || true
          fi
          if [[ -n "${ODOO_ENV_FILE:-}" ]]; then
            docker compose \
              --env-file "$ODOO_ENV_FILE" \
              -f infra/persistence/compose.test.yaml \
              down --volumes --remove-orphans || true
            docker compose \
              --env-file "$ODOO_ENV_FILE" \
              -f infra/odoo/compose.yaml \
              down --volumes --remove-orphans || true
          fi
